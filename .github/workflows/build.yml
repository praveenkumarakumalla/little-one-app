name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.praveen --project-name little_one .
          python3 tool/prepare_android.py

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LittleOne.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LittleOne-apk
          path: LittleOne.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Little One v1.0.${{ github.run_number }}
          body: "Download **LittleOne.apk** below on your Android phone, open it and tap Install."
          files: LittleOne.apk
