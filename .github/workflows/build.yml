name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.praveen --project-name little_one .
          python3 tool/prepare_android.py

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          f=build.log; [ -f "$f" ] || exit 0
          grep -n -i -E "error|what went wrong|exception|failed|unresolved|not found|cannot|incompatible|requires" "$f" | grep -v -i "warning" | head -60 > errs.txt || true
          tail -n 60 "$f" >> errs.txt
          python3 - <<'PY'
          import re
          t=open("errs.txt",encoding="utf-8",errors="replace").read()
          chunks=[t[i:i+3500] for i in range(0,len(t),3500)][:9]
          for i,c in enumerate(chunks):
              c=c.replace("%","%25").replace("\r","").replace("\n","%0A")
              print(f"::error title=build-log-{i}::{c}")
          PY

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LittleOne.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk LittleOne-older-phones.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LittleOne-apk
          path: "*.apk"

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Little One v1.0.${{ github.run_number }}
          body: "Download **LittleOne.apk** below on your Android phone, open it and tap Install. (Only if it says it can't install on your phone, use LittleOne-older-phones.apk.)"
          files: |
            LittleOne.apk
            LittleOne-older-phones.apk
