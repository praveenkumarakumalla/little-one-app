name: Gemini baby voices

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "samples or all"
        default: samples
      voice:
        description: "Leda, Laomedeia, Zephyr, Autonoe..."
        default: Leda
      shift:
        description: "child pitch shift (1.0 = none)"
        default: "1.0"

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Make voices
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.LITTLE_ONE }}
        run: |
          sudo apt-get install -y ffmpeg > /dev/null
          python3 tool/voices/gemini_voices.py "${{ inputs.mode }}" "${{ inputs.voice }}" "${{ inputs.shift }}"
      - name: Save to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d voice_samples ] && git add -A voice_samples
          [ -d assets/voice ] && git add -A assets/voice
          git commit -m "Gemini baby voices: ${{ inputs.mode }} ${{ inputs.voice }} [skip ci]" || exit 0
          git pull --rebase
          git push
