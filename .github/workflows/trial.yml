name: Build trial app

on:
  push:
    branches: [main]
    paths:
      - 'lib/trial/**'
      - 'assets/trial/**'
      - 'tool/trial/**'
      - '.github/workflows/trial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project files
        run: |
          set -o pipefail
          flutter create --platforms=android --org com.praveen --project-name little_one . 2>&1 | tee build.log
          python3 tool/prepare_android.py 2>&1 | tee -a build.log
          # a separate app next to the family app
          sed -i 's/applicationId = "com.praveen.little_one"/applicationId = "com.praveen.littleone.trial"/' android/app/build.gradle.kts
          grep -q 'com.praveen.littleone.trial' android/app/build.gradle.kts || { echo "::error title=trial::applicationId not changed"; exit 1; }

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons -f flutter_launcher_icons-trial.yaml

      - name: Check code
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings lib 2>&1 | tee analyze.log || {
            grep -E "^ *error" analyze.log | head -40 | while IFS= read -r l; do echo "::error title=analyze::$l"; done
            exit 1
          }

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release -t lib/trial/main.dart --split-per-abi --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          f=build.log; [ -f "$f" ] || exit 0
          grep -n -i -E "error|what went wrong|exception|failed|unresolved|not found|cannot|incompatible|requires" "$f" | grep -v -i "warning" | head -60 > errs.txt || true
          tail -n 60 "$f" >> errs.txt
          python3 - <<'PY'
          import re
          t=open("errs.txt",encoding="utf-8",errors="replace").read()
          chunks=[t[i:i+3500] for i in range(0,len(t),3500)][:9]
          for i,c in enumerate(chunks):
              c=c.replace("%","%25").replace("\r","").replace("\n","%0A")
              print(f"::error title=build-log-{i}::{c}")
          PY

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LittleOneTrial.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk LittleOneTrial-older-phones.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LittleOneTrial-apk
          path: "*.apk"

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trial-1.0.${{ github.run_number }}
          name: Little One trial 1.0.${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: "New Little One (trial). Download **LittleOneTrial.apk** on your Android phone and tap Install. It installs next to the family app."
          files: |
            LittleOneTrial.apk
            LittleOneTrial-older-phones.apk
