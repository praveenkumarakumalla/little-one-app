name: little_one
description: "Little One Diary – baby diary, feeding alarm, sleep watch, lullabies and jatakam."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  video_player: ^2.9.1
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  file_selector: ^1.0.3
  record: ">=6.0.0 <8.0.0"
  permission_handler: ^12.0.1
  alarm: ">=5.0.0 <6.0.0"
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  http: ^1.2.2
  cryptography: ^2.7.0
  camera: ^0.11.1
  google_mlkit_face_detection: ">=0.13.0 <1.0.0"
  image: ^4.3.0
  flutter_local_notifications: ">=19.0.0 <20.0.0"
  android_alarm_manager_plus: ^5.1.2
  timezone: ">=0.10.0 <0.11.0"
  youtube_player_iframe: ">=5.2.0 <7.0.0"
  webview_flutter: ">=4.4.0 <5.0.0"
  tflite_flutter: ">=0.11.0 <0.13.0"
  package_info_plus: ">=8.0.0 <10.0.0"
  open_filex: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "assets/icon_bg.png"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
  shaders:
    - shaders/face_warp.frag
  assets:
    - assets/patrika.json
    - assets/songs.json
    - assets/chart.json
    - assets/audio/music_box.wav
    - assets/audio/alarm.wav
    - assets/farts/
    - assets/voice/
    - assets/voice_fb/
    - assets/ml/
    - assets/games3d/
